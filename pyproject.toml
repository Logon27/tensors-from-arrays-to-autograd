description = "A minimal tensor library built from scratch in Python"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.11.1",
    "numpy>=2.5.3",
]

[project.optional-dependencies]
cuda = [
    "cupy-cuda13x>=14.1.1",
]
